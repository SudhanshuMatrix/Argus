name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the APK to a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      # Optional: sign with your own key so updates install over the previous version.
      # Add the secrets ARGUS_KEYSTORE_BASE64, ARGUS_KEYSTORE_PASSWORD, ARGUS_KEY_ALIAS and
      # ARGUS_KEY_PASSWORD. Without them the APK is signed with a throwaway debug key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARGUS_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/argus-release.jks"
          echo "ARGUS_KEYSTORE_PATH=$RUNNER_TEMP/argus-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ARGUS_KEYSTORE_PASSWORD: ${{ secrets.ARGUS_KEYSTORE_PASSWORD }}
          ARGUS_KEY_ALIAS: ${{ secrets.ARGUS_KEY_ALIAS }}
          ARGUS_KEY_PASSWORD: ${{ secrets.ARGUS_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Check the privacy promise (no internet, no location)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_(COARSE|FINE)_LOCATION)" permissions.txt; then
            echo "::error::The release APK must not have the INTERNET or location permission"
            exit 1
          fi

      - name: Name the APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Argus-$VERSION.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Argus-apk
          path: dist/
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
